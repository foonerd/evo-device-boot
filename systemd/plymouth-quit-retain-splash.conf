# evo-device-boot: seamless Plymouth -> compositor handoff.
#
# Installed as a drop-in for the stock plymouth-quit.service at
#   /etc/systemd/system/plymouth-quit.service.d/10-evo-retain-splash.conf
#
# The stock unit runs `plymouth quit`, which tears the splash down to a
# blank console. Until the kiosk compositor (labwc) takes DRM master and
# paints its first frame, that leaves the panel showing bare console -
# the visible gap between the boot splash and the UI.
#
# `--retain-splash` leaves the last splash frame in the framebuffer and
# drops DRM master (so the compositor can take over) WITHOUT restoring
# the console. The retained image stays on screen until labwc's first
# modeset/pageflip paints over it - a seamless dissolve from splash to
# UI with no black frame, regardless of how long the compositor takes to
# come up.
#
# Pairs with the kiosk being re-gated off network-online.target (see
# evo-kiosk-eng evo-kiosk.service + evo-ui.service) so the gap it must
# cover is a second or two, not the ~9s the network-online wait imposed.
[Service]
ExecStart=
ExecStart=/usr/bin/plymouth quit --retain-splash
